services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wrapzzo
      POSTGRES_USER: wrapzzo
      POSTGRES_PASSWORD: wrapzzo
    ports:
      - "5432:5432"
    volumes:
      - wrapzzo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapzzo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - wrapzzo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store for local dev. The app talks to it via the
  # plain AWS S3 SDK with an endpoint override -- same code path as real S3
  # in production, just a different endpoint + credentials.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wrapzzo-minio-data:/data

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wrapzzo
      DB_USERNAME: wrapzzo
      DB_PASSWORD: wrapzzo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Internal -- the backend container reaches MinIO via the docker network.
      S3_ENDPOINT: http://minio:9000
      # Baked into presigned upload URLs and public logo URLs, both handed
      # straight to the browser -- must be browser-reachable, not the
      # internal docker network hostname.
      S3_PRESIGN_ENDPOINT: http://localhost:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/wrapzzo-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  wrapzzo-postgres-data:
  wrapzzo-redis-data:
  wrapzzo-minio-data:
