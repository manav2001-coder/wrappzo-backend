spring.application.name=wrapzzo-backend

# We authenticate against our own users table (AuthService), never Spring Security's
# standard AuthenticationManager/UserDetailsService flow, so its default in-memory
# fallback user is irrelevant noise here.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wrapzzo}
spring.datasource.username=${DB_USERNAME:wrapzzo}
spring.datasource.password=${DB_PASSWORD:wrapzzo}

# Connection pool (HikariCP). The default is 10, which a few hundred people clicking at
# once would exhaust: requests would queue for a connection and then fail. 30 per
# replica leaves Postgres (max_connections 500 on Railway) room for ~10 replicas plus
# migrations and admin sessions -- if you run more replicas, lower DB_POOL_SIZE or raise
# the database limit so replicas * DB_POOL_SIZE stays well under it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
# Fail a request after 10s without a connection (default 30s) instead of hanging the user.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
# Retire connections before a proxy or the database can silently drop them.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}
# Log (not fail) when a connection is held over 30s -- finds a slow query or a leak.
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_THRESHOLD_MS:30000}
spring.datasource.hikari.pool-name=wrapzzo-db

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Lets Hibernate group inserts/updates into batched JDBC statements instead of one
# round-trip per row -- matters most for bulk user import (thousands of rows in one
# request). Safe to batch here: every entity id is client-generated
# (GenerationType.UUID), so nothing needs an immediate round-trip back for a
# DB-assigned key, which is the usual reason batching silently doesn't kick in.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Dev-only default. Override with a real secret via the JWT_SECRET env var outside local dev.
jwt.secret=${JWT_SECRET:oa00eNTpcQqJUERtepvRFmoZFfGNJCos94HQxu6pgdW/9XEYYIJPnqbH53YQbCxWxsgi7Yz4R9utsSda+wFYGA==}
jwt.access-token-expiry-minutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:15}

auth.refresh-token-expiry-days=${AUTH_REFRESH_TOKEN_EXPIRY_DAYS:30}
auth.max-failed-login-attempts=${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
auth.lockout-duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Browser-facing base URL of the frontend -- used to build the link inside a
# vendor's invite email. Must be the real public frontend origin in any
# deployed environment, not this backend's own URL.
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# How long a vendor's password-setup link stays valid before they need a resend.
vendor.invite-token-expiry-hours=${VENDOR_INVITE_TOKEN_EXPIRY_HOURS:48}

# Same, for a bulk-imported platform user's password-setup link.
user.invite-token-expiry-hours=${USER_INVITE_TOKEN_EXPIRY_HOURS:48}

# Resend (https://resend.com) sends the vendor invite email. from-address must
# be on a domain verified in the Resend dashboard.
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:}

# Object storage. Locally this points at the docker-compose MinIO (S3-compatible);
# in a real AWS deployment, leave s3.endpoint/s3.presign-endpoint UNSET (empty) so the
# SDK talks to real regional S3 endpoints, which are already browser-reachable.
# s3.endpoint = the backend's OWN calls (bucket create/delete, container-to-container).
# s3.presign-endpoint = baked into presigned upload URLs and public logo URLs, handed
# straight to the browser -- must be a browser-reachable host, never a docker-internal one.
s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
s3.presign-endpoint=${S3_PRESIGN_ENDPOINT:http://localhost:9000}
s3.region=${S3_REGION:us-east-1}
s3.access-key=${S3_ACCESS_KEY:minioadmin}
s3.secret-key=${S3_SECRET_KEY:minioadmin}
s3.bucket=${S3_BUCKET:wrapzzo-assets}
s3.public-base-url=${S3_PUBLIC_BASE_URL:http://localhost:9000/wrapzzo-assets}

# ---- Monitoring ----
# Metrics (request rates and latency by endpoint and status, error counts, database pool use, JVM, queues) are served
# in Prometheus format on a SEPARATE port. Railway only routes its public domain to the app's own port, so this one is
# reachable from inside the project's private network only -- point a scraper (Grafana Agent, Prometheus) at
# http://<service>.railway.internal:9090/actuator/prometheus. Never set MANAGEMENT_PORT to the app's own port.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=wrapzzo-backend
# Per-bucket latency, so a dashboard can chart p95/p99 by endpoint.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# A request slower than this is logged as a WARN line naming it (SlowRequestLogFilter); a SQL query slower than this
# many ms is logged by Hibernate under org.hibernate.SQL_SLOW. Searching the logs for either finds the slow screen.
monitoring.slow-request-ms=${SLOW_REQUEST_MS:1500}
spring.jpa.properties.hibernate.log_slow_query=${SLOW_QUERY_MS:500}
logging.level.org.hibernate.SQL_SLOW=INFO
